<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Design Generator</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --border: rgba(255, 255, 255, 0.1);
      --primary: #38bdf8;
      --text: #f8fafc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 30px 20px;
    }

    .container {
      max-width: 950px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    h1 {
      font-size: 2rem;
      background: linear-gradient(135deg, var(--primary), #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    .main-grid {
      display: grid;
      grid-template-columns: 350px 1fr;
      gap: 20px;
    }

    @media (max-width: 768px) {
      .main-grid {
        grid-template-columns: 1fr;
      }
    }

    .panel {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
    }

    .panel-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 20px;
      color: var(--primary);
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
    }

    .control-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 6px;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--primary);
    }

    input[type="color"] {
      border: none;
      background: none;
      width: 40px;
      height: 40px;
      cursor: pointer;
    }

    .color-row {
      display: flex;
      gap: 15px;
      align-items: center;
    }

    .preview-box {
      background: #020617;
      border: 1px solid var(--border);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 400px;
      padding: 30px;
    }

    #target {
      width: 180px;
      height: 180px;
      background: white;
      border-radius: 16px;
      transition: all 0.1s ease;
      margin-bottom: 30px;
    }

    .code-box {
      width: 100%;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid var(--border);
      padding: 15px;
      border-radius: 10px;
      font-family: monospace;
      font-size: 0.9rem;
      color: #38bdf8;
      word-break: break-all;
      cursor: pointer;
      position: relative;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>CSS Gradient & Shadow Designer</h1>
      <p style="color: #94a3b8;">Adjust margins, gradients, shadows and instantly copy generated CSS styling.</p>
    </header>

    <div class="main-grid">
      <div class="panel">
        <div class="panel-title">Shadow Settings</div>
        
        <div class="control-group">
          <label>Offset X (<span id="val-x">5</span>px)</label>
          <input type="range" id="offsetX" min="-30" max="30" value="5" oninput="updateCSS()">
        </div>

        <div class="control-group">
          <label>Offset Y (<span id="val-y">5</span>px)</label>
          <input type="range" id="offsetY" min="-30" max="30" value="5" oninput="updateCSS()">
        </div>

        <div class="control-group">
          <label>Blur Radius (<span id="val-blur">15</span>px)</label>
          <input type="range" id="blur" min="0" max="50" value="15" oninput="updateCSS()">
        </div>

        <div class="panel-title" style="margin-top: 25px;">Gradient Colors</div>

        <div class="control-group color-row">
          <div>
            <label>Color 1</label>
            <input type="color" id="color1" value="#38bdf8" oninput="updateCSS()">
          </div>
          <div>
            <label>Color 2</label>
            <input type="color" id="color2" value="#a855f7" oninput="updateCSS()">
          </div>
        </div>
      </div>

      <div class="preview-box">
        <div id="target"></div>
        <div class="code-box" id="codeBox" onclick="copyCode()">
          /* Click to Copy */
          box-shadow: 5px 5px 15px rgba(0,0,0,0.5);
        </div>
      </div>
    </div>
  </div>

  <script>
    function updateCSS() {
      const x = document.getElementById("offsetX").value;
      const y = document.getElementById("offsetY").value;
      const blur = document.getElementById("blur").value;
      
      const c1 = document.getElementById("color1").value;
      const c2 = document.getElementById("color2").value;

      document.getElementById("val-x").textContent = x;
      document.getElementById("val-y").textContent = y;
      document.getElementById("val-blur").textContent = blur;

      const target = document.getElementById("target");
      const shadowValue = `${x}px ${y}px ${blur}px rgba(0, 0, 0, 0.6)`;
      const gradientValue = `linear-gradient(135deg, ${c1}, ${c2})`;

      target.style.boxShadow = shadowValue;
      target.style.background = gradientValue;

      const codeBox = document.getElementById("codeBox");
      codeBox.innerHTML = `background: ${gradientValue};<br>box-shadow: ${shadowValue};`;
    }

    function copyCode() {
      const range = document.createRange();
      range.selectNode(document.getElementById("codeBox"));
      window.getSelection().removeAllRanges();
      window.getSelection().addRange(range);
      document.execCommand("copy");
      window.getSelection().removeAllRanges();
      alert("CSS Code copied to clipboard!");
    }

    // Init
    updateCSS();
  </script>

<!-- Floating Download Button -->
<div id="assignment-download-btn-container" style="position: fixed; bottom: 20px; right: 20px; z-index: 999999; font-family: system-ui, -apple-system, sans-serif;">
  <button onclick="downloadCurrentAssignmentFile()" style="display: flex; align-items: center; justify-content: center; gap: 8px; background: linear-gradient(135deg, #38bdf8, #a855f7); color: white; border: none; padding: 12px 18px; border-radius: 50px; font-weight: 600; cursor: pointer; box-shadow: 0 10px 25px rgba(56, 189, 248, 0.4), inset 0 1px 0 rgba(255,255,255,0.2); transition: all 0.3s ease; font-size: 14px;">
    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 2px;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
    Download File
  </button>
</div>
<script>
  function downloadCurrentAssignmentFile() {
    const url = window.location.href;
    const filename = url.substring(url.lastIndexOf('/') + 1) || 'assignment.html';
    fetch(url)
      .then(response => {
        if (!response.ok) throw new Error('Network response was not ok');
        return response.blob();
      })
      .then(blob => {
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      })
      .catch(err => {
        const link = document.createElement('a');
        link.href = url;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      });
  }
</script>
</body>
</html>
