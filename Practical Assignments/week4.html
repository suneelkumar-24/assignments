<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML5 Interactive Canvas Board</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --border: rgba(255, 255, 255, 0.1);
      --primary: #38bdf8;
      --text: #f8fafc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 30px 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 25px;
      text-align: center;
    }

    h1 {
      font-size: 2rem;
      background: linear-gradient(135deg, var(--primary), #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    .board-layout {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .toolbar {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 15px;
      display: flex;
      gap: 20px;
      align-items: center;
      flex-wrap: wrap;
    }

    .tool-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    label {
      font-size: 0.85rem;
      color: #94a3b8;
    }

    input[type="color"] {
      border: none;
      background: none;
      width: 35px;
      height: 35px;
      cursor: pointer;
    }

    input[type="range"] {
      width: 100px;
      accent-color: var(--primary);
    }

    button {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      color: white;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      transition: all 0.2s;
    }

    button:hover {
      background: var(--primary);
      color: black;
      border-color: var(--primary);
    }

    .canvas-container {
      background: white;
      border: 4px solid #334155;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    canvas {
      display: block;
      cursor: crosshair;
      width: 100%;
      height: 450px;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Interactive Canvas Drawing Board</h1>
      <p style="color: #94a3b8;">Draw shapes, write code concepts, change brush details, and export as PNG.</p>
    </header>

    <div class="board-layout">
      <div class="toolbar">
        <div class="tool-group">
          <label>Color</label>
          <input type="color" id="brushColor" value="#0f172a">
        </div>

        <div class="tool-group">
          <label>Brush Size (<span id="brushVal">5</span>px)</label>
          <input type="range" id="brushSize" min="1" max="30" value="5" oninput="document.getElementById('brushVal').textContent=this.value">
        </div>

        <button onclick="clearCanvas()">🧹 Clear Board</button>
        <button onclick="downloadCanvas()" style="margin-left: auto; background: linear-gradient(135deg, var(--primary), #a855f7); border: none; color: white;">💾 Export Image</button>
      </div>

      <div class="canvas-container">
        <canvas id="paintCanvas"></canvas>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("paintCanvas");
    const ctx = canvas.getContext("2d");

    // Resize canvas properly
    function resizeCanvas() {
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = 450;
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
    }

    window.addEventListener("load", resizeCanvas);
    window.addEventListener("resize", () => {
      // Draw state is lost on resize, so we only resize if canvas isn't initialized
    });

    let painting = false;

    function startPosition(e) {
      painting = true;
      draw(e);
    }

    function finishedPosition() {
      painting = false;
      ctx.beginPath();
    }

    function getMousePos(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: clientX - rect.left,
        y: clientY - rect.top
      };
    }

    function draw(e) {
      if (!painting) return;
      
      const pos = getMousePos(e);
      ctx.lineWidth = document.getElementById("brushSize").value;
      ctx.strokeStyle = document.getElementById("brushColor").value;

      ctx.lineTo(pos.x, pos.y);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(pos.x, pos.y);
    }

    // Mouse listeners
    canvas.addEventListener("mousedown", startPosition);
    canvas.addEventListener("mouseup", finishedPosition);
    canvas.addEventListener("mousemove", draw);

    // Touch support for mobiles
    canvas.addEventListener("touchstart", (e) => { e.preventDefault(); startPosition(e); });
    canvas.addEventListener("touchend", finishedPosition);
    canvas.addEventListener("touchmove", (e) => { e.preventDefault(); draw(e); });

    function clearCanvas() {
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    function downloadCanvas() {
      const link = document.createElement("a");
      link.download = "my_masterpiece.png";
      link.href = canvas.toDataURL();
      link.click();
    }
  </script>

<!-- Floating Download Button -->
<div id="assignment-download-btn-container" style="position: fixed; bottom: 20px; right: 20px; z-index: 999999; font-family: system-ui, -apple-system, sans-serif;">
  <button onclick="downloadCurrentAssignmentFile()" style="display: flex; align-items: center; justify-content: center; gap: 8px; background: linear-gradient(135deg, #38bdf8, #a855f7); color: white; border: none; padding: 12px 18px; border-radius: 50px; font-weight: 600; cursor: pointer; box-shadow: 0 10px 25px rgba(56, 189, 248, 0.4), inset 0 1px 0 rgba(255,255,255,0.2); transition: all 0.3s ease; font-size: 14px;">
    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 2px;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
    Download File
  </button>
</div>
<script>
  function downloadCurrentAssignmentFile() {
    const url = window.location.href;
    const filename = url.substring(url.lastIndexOf('/') + 1) || 'assignment.html';
    fetch(url)
      .then(response => {
        if (!response.ok) throw new Error('Network response was not ok');
        return response.blob();
      })
      .then(blob => {
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      })
      .catch(err => {
        const link = document.createElement('a');
        link.href = url;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      });
  }
</script>
</body>
</html>
