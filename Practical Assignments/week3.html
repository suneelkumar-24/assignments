<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Box Model & Flexbox Visualizer</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --border: rgba(255, 255, 255, 0.1);
      --primary: #38bdf8;
      --secondary: #a855f7;
      --text: #f8fafc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 30px 20px;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 30px;
      text-align: center;
    }

    h1 {
      font-size: 2rem;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
    }

    .main-grid {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 20px;
    }

    @media (max-width: 768px) {
      .main-grid {
        grid-template-columns: 1fr;
      }
    }

    .panel {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
    }

    .panel-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 20px;
      color: var(--primary);
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
    }

    .control-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 6px;
    }

    select, input[type="range"] {
      width: 100%;
      background: #1e293b;
      border: 1px solid var(--border);
      color: white;
      padding: 8px 12px;
      border-radius: 8px;
      outline: none;
    }

    .preview-area {
      background: #020617;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 30px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 350px;
    }

    .flex-container {
      background: rgba(255, 255, 255, 0.05);
      border: 2px dashed #475569;
      border-radius: 12px;
      width: 100%;
      height: 300px;
      display: flex;
      padding: 10px;
      transition: all 0.3s ease;
    }

    .flex-item {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      font-weight: 700;
      font-size: 1.2rem;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 8px;
      min-width: 60px;
      min-height: 60px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 10px rgba(56, 189, 248, 0.2);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>CSS Flexbox & Box Model Visualizer</h1>
      <p style="color: #94a3b8;">Interactive sandbox to master layout calculations and styling parameters.</p>
    </header>

    <div class="main-grid">
      <div class="panel">
        <div class="panel-title">Layout Controls</div>
        
        <div class="control-group">
          <label>Flex Direction</label>
          <select id="direction" onchange="updateFlex()">
            <option value="row">row</option>
            <option value="row-reverse">row-reverse</option>
            <option value="column">column</option>
            <option value="column-reverse">column-reverse</option>
          </select>
        </div>

        <div class="control-group">
          <label>Justify Content</label>
          <select id="justify" onchange="updateFlex()">
            <option value="flex-start">flex-start</option>
            <option value="flex-end">flex-end</option>
            <option value="center">center</option>
            <option value="space-between">space-between</option>
            <option value="space-around">space-around</option>
            <option value="space-evenly">space-evenly</option>
          </select>
        </div>

        <div class="control-group">
          <label>Align Items</label>
          <select id="align" onchange="updateFlex()">
            <option value="stretch">stretch</option>
            <option value="flex-start">flex-start</option>
            <option value="flex-end">flex-end</option>
            <option value="center">center</option>
            <option value="baseline">baseline</option>
          </select>
        </div>

        <div class="panel-title" style="margin-top: 25px;">Box Model Controls (Item 1)</div>

        <div class="control-group">
          <label>Margin: <span id="val-margin">10</span>px</label>
          <input type="range" id="margin" min="0" max="40" value="10" oninput="updateBoxModel()">
        </div>

        <div class="control-group">
          <label>Padding: <span id="val-padding">15</span>px</label>
          <input type="range" id="padding" min="0" max="40" value="15" oninput="updateBoxModel()">
        </div>

        <div class="control-group">
          <label>Border Radius: <span id="val-radius">8</span>px</label>
          <input type="range" id="radius" min="0" max="30" value="8" oninput="updateBoxModel()">
        </div>
      </div>

      <div class="panel preview-area">
        <div class="flex-container" id="flexContainer">
          <div class="flex-item" id="item1">1</div>
          <div class="flex-item" id="item2" style="background: linear-gradient(135deg, #a855f7, #ec4899);">2</div>
          <div class="flex-item" id="item3" style="background: linear-gradient(135deg, #ec4899, #f43f5e);">3</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    function updateFlex() {
      const container = document.getElementById("flexContainer");
      container.style.flexDirection = document.getElementById("direction").value;
      container.style.justifyContent = document.getElementById("justify").value;
      container.style.alignItems = document.getElementById("align").value;
    }

    function updateBoxModel() {
      const item = document.getElementById("item1");
      
      const margin = document.getElementById("margin").value;
      const padding = document.getElementById("padding").value;
      const radius = document.getElementById("radius").value;

      document.getElementById("val-margin").textContent = margin;
      document.getElementById("val-padding").textContent = padding;
      document.getElementById("val-radius").textContent = radius;

      item.style.margin = `${margin}px`;
      item.style.padding = `${padding}px`;
      item.style.borderRadius = `${radius}px`;
    }

    // Init
    updateFlex();
    updateBoxModel();
  </script>

<!-- Floating Download Button -->
<div id="assignment-download-btn-container" style="position: fixed; bottom: 20px; right: 20px; z-index: 999999; font-family: system-ui, -apple-system, sans-serif;">
  <button onclick="downloadCurrentAssignmentFile()" style="display: flex; align-items: center; justify-content: center; gap: 8px; background: linear-gradient(135deg, #38bdf8, #a855f7); color: white; border: none; padding: 12px 18px; border-radius: 50px; font-weight: 600; cursor: pointer; box-shadow: 0 10px 25px rgba(56, 189, 248, 0.4), inset 0 1px 0 rgba(255,255,255,0.2); transition: all 0.3s ease; font-size: 14px;">
    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 2px;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
    Download File
  </button>
</div>
<script>
  function downloadCurrentAssignmentFile() {
    const url = window.location.href;
    const filename = url.substring(url.lastIndexOf('/') + 1) || 'assignment.html';
    fetch(url)
      .then(response => {
        if (!response.ok) throw new Error('Network response was not ok');
        return response.blob();
      })
      .then(blob => {
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      })
      .catch(err => {
        const link = document.createElement('a');
        link.href = url;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      });
  }
</script>
</body>
</html>
