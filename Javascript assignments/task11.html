<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Number Guessing Game</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; padding: 40px 20px; text-align: center; }
    .card { background: #1e293b; padding: 30px; border-radius: 16px; max-width: 450px; margin: 0 auto; box-shadow: 0 10px 30px rgba(0,0,0,0.4); }
    input { background: #020617; border: 1px solid #334155; color: white; padding: 12px; border-radius: 8px; font-size: 16px; width: 80%; margin: 15px 0; text-align: center; }
    button { background: #38bdf8; color: #020617; border: none; padding: 12px 24px; border-radius: 50px; font-weight: 700; font-size: 15px; cursor: pointer; }
    #result { margin-top: 20px; font-size: 1.1rem; font-weight: 600; min-height: 30px; }
  </style>
</head>
<body>

  <div class="card">
    <h2>🎯 Number Guessing Game</h2>
    <p style="color: #94a3b8; font-size: 0.9rem;">Guess a secret number between 1 and 10!</p>

    <input type="number" id="guessInput" placeholder="Enter guess (1 - 10)" min="1" max="10">
    <br>
    <button onclick="checkGuess()">Submit Guess</button>

    <div id="result"></div>
  </div>

  <script>
    const secret = 7;

    function checkGuess() {
      const guess = Number(document.getElementById("guessInput").value);
      const res = document.getElementById("result");

      if (!guess) {
        res.innerHTML = "⚠️ Please enter a valid number!";
        res.style.color = "#f59e0b";
        return;
      }

      if (guess === secret) {
        res.innerHTML = "🎉 Correct! You won!";
        res.style.color = "#10b981";
      } else if (guess > secret) {
        res.innerHTML = "📈 Too high! Try a smaller number.";
        res.style.color = "#ef4444";
      } else {
        res.innerHTML = "📉 Too low! Try a bigger number.";
        res.style.color = "#38bdf8";
      }
    }
  </script>

  <!-- Task Hint Helper & Floating Actions -->
  <script src="task-hint-helper.js"></script>
</body>
</html>
