<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Portfolio</title>
  <style>
    body {
      font-family: Arial;
      margin: 0;
      background: #f9f9f9;
    }

    header {
      background-color: #333;
      color: white;
      padding: 20px;
      text-align: center;
    }

    nav {
      background-color: #444;
      padding: 10px;
      text-align: center;
    }

    nav a {
      color: white;
      margin: 0 15px;
      text-decoration: none;
    }

    .about, .projects, footer {
      padding: 30px;
      text-align: center;
    }

    .cards {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .card {
      background: white;
      padding: 15px;
      width: 250px;
      border: 1px solid #ccc;
      border-radius: 10px;
    }

    footer {
      background: #333;
      color: white;
    }
  </style>
</head>
<body>

  <header>
    <h1>John Doe</h1>
    <p>Web Developer Portfolio</p>
  </header>

  <nav>
    <a href="#">About</a>
    <a href="#">Projects</a>
    <a href="#">Contact</a>
  </nav>

  <div class="about">
    <h2>About Me</h2>
    <p>Hello! I'm a web developer who loves building beautiful websites.</p>
  </div>

  <div class="projects">
    <h2>My Projects</h2>
    <div class="cards">
      <div class="card">
        <h3>Project One</h3>
        <p>A simple HTML/CSS website.</p>
      </div>
      <div class="card">
        <h3>Project Two</h3>
        <p>Portfolio template with flexbox.</p>
      </div>
    </div>
  </div>

  <footer>
    &copy; 2025 John Doe | Contact: email@example.com
  </footer>


<!-- Floating Download Button -->
<div id="assignment-download-btn-container" style="position: fixed; bottom: 20px; right: 20px; z-index: 999999; font-family: system-ui, -apple-system, sans-serif;">
  <button onclick="downloadCurrentAssignmentFile()" style="display: flex; align-items: center; justify-content: center; gap: 8px; background: linear-gradient(135deg, #38bdf8, #a855f7); color: white; border: none; padding: 12px 18px; border-radius: 50px; font-weight: 600; cursor: pointer; box-shadow: 0 10px 25px rgba(56, 189, 248, 0.4), inset 0 1px 0 rgba(255,255,255,0.2); transition: all 0.3s ease; font-size: 14px;">
    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 2px;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
    Download File
  </button>
</div>
<script>
  function downloadCurrentAssignmentFile() {
    const url = window.location.href;
    const filename = url.substring(url.lastIndexOf('/') + 1) || 'assignment.html';
    fetch(url)
      .then(response => {
        if (!response.ok) throw new Error('Network response was not ok');
        return response.blob();
      })
      .then(blob => {
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      })
      .catch(err => {
        const link = document.createElement('a');
        link.href = url;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      });
  }
</script>

</body>
</html>
